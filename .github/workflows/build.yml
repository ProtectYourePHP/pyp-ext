# Workflow of the split repository ProtectYourePHP/pyp-ext (lives in ext/ of the main repository).
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        ts: ['nts']
        include:
          - php: '8.4'
            ts: 'ts'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts }}
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none
      - name: Build
        run: |
          phpize
          ./configure --enable-pyp
          make -j"$(nproc)" CFLAGS="-g -O2 -Wall -Werror"
      - name: Test
        run: make test TESTS="tests" NO_INTERACTION=1 REPORT_EXIT_STATUS=1

  macos:
    name: macOS PHP 8.4
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none
      - run: phpize && ./configure --enable-pyp && make -j"$(sysctl -n hw.ncpu)"
      - run: make test TESTS="tests" NO_INTERACTION=1 REPORT_EXIT_STATUS=1
